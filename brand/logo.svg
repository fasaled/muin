<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Muin">
  <!--
    A PDF page whose object graph walks off the file:
    incoming → current → a ref that leaves the page.
    Colors match the TUI (cyan neighbors, green current object).
  -->
  <rect width="128" height="128" rx="28" fill="#15201F"/>
  <path fill="#E8F2EF" d="M30 18h46l26 26v66c0 6.6-5.4 12-12 12H30c-6.6 0-12-5.4-12-12V30c0-6.6 5.4-12 12-12z"/>
  <path fill="#B7D4CE" d="M76 18l26 26H82c-3.3 0-6-2.7-6-6V18z"/>
  <clipPath id="a">
    <rect width="128" height="128" rx="28"/>
  </clipPath>
  <g clip-path="url(#a)">
    <path fill="none" stroke="#1A4A44" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
          d="M48 58h28L108 98"/>
    <circle cx="48" cy="58" r="8" fill="#4EC9B0"/>
    <circle cx="76" cy="58" r="11" fill="#3DD68C"/>
    <circle cx="108" cy="98" r="10" fill="#4EC9B0"/>
  </g>
</svg>
