name: qpdf WASM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "wasm/**"
      - "vendor/qpdf/**"
      - ".github/workflows/wasm.yml"
  push:
    branches: [main]
    paths:
      - "wasm/**"
      - "vendor/qpdf/**"
      - ".github/workflows/wasm.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f wasm/Dockerfile -t muin-qpdf-wasm wasm/
      - name: Emit artifacts
        run: |
          mkdir -p /tmp/qpdf-out
          docker run --rm -v /tmp/qpdf-out:/out muin-qpdf-wasm
          ls -la /tmp/qpdf-out
      - name: Compare with vendored files
        run: |
          if [ ! -f vendor/qpdf/qpdf.wasm ]; then
            echo "vendor/qpdf/qpdf.wasm is missing; copy the CI artifacts"
            exit 1
          fi
          cmp /tmp/qpdf-out/qpdf.wasm vendor/qpdf/qpdf.wasm
